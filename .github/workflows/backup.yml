name: Backup semanal

# Todo domingo (03h no horário de Brasília) e sob demanda (aba Actions > Backup semanal > Run workflow).
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Confere os segredos
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$KEY" ]  || { echo "::error::Falta o segredo SUPABASE_SERVICE_ROLE_KEY (ver README, seção Backup)."; exit 1; }
          [ -n "$PASS" ] || { echo "::error::Falta o segredo BACKUP_PASSPHRASE (ver README, seção Backup)."; exit 1; }

      - name: Baixa tabelas e fotos
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs backup

      # O repositório é público e o backup tem rascunhos: sai criptografado (AES-256).
      - name: Compacta e criptografa
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar -czf backup.tar.gz backup
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in backup.tar.gz -out backup.tar.gz.enc -pass env:BACKUP_PASSPHRASE
          rm -rf backup backup.tar.gz
          ls -l backup.tar.gz.enc

      - uses: actions/upload-artifact@v4
        with:
          name: backup-mio-${{ github.run_number }}
          path: backup.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
