<!doctype html>
<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-scope="campanhas">

<header class="masthead">

<button class="spine-toggle" id="spineToggle" aria-expanded="false" aria-controls="spine">☰ Índice de Campanhas</button>

        <svg viewBox="0 0 140 160">
          <defs>
            <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:var(--eyecore)"/>
              <stop offset="38%" style="stop-color:var(--violet)"/>
              <stop offset="100%" style="stop-color:var(--violet)" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <path d="M70 6 C42 6 20 30 20 60 C20 82 28 98 36 110 C40 116 44 122 44 132 C44 138 48 142 54 142 L86 142 C92 142 96 138 96 132 C96 122 100 116 104 110 C112 98 120 82 120 60 C120 30 98 6 70 6 Z"
            style="fill:var(--hood)" stroke="none"/>
          <path id="skullFace" d="M70 26 C50 26 34 44 34 66 C34 84 40 96 46 106 C49 111 52 116 52 124 L88 124 C88 116 91 111 94 106 C100 96 106 84 106 66 C106 44 90 26 70 26 Z"
            style="fill:var(--skull-skin)"/>
          <use href="#skullFace" fill="none" stroke="var(--sun)" stroke-width="2.4"/>
          <use href="#skullFace" fill="none" stroke="var(--sun)" stroke-width="1" stroke-dasharray="1.5 4.5" opacity=".7" transform="translate(0,-3) scale(0.985)" transform-origin="70 84"/>
          <line x1="70" y1="34" x2="70" y2="58" style="stroke:var(--hood)" stroke-width="1.3" opacity=".3"/>
          <path d="M70 82 L64 94 L76 94 Z" style="fill:var(--hood)" opacity=".85"/>
          <circle class="skull-eye-glow skull-eye-glow--left" cx="54" cy="68" r="15" fill="url(#eyeGlow)"/>
          <circle class="skull-eye-glow skull-eye-glow--right" cx="86" cy="68" r="15" fill="url(#eyeGlow)"/>
          <circle cx="54" cy="68" r="5.5" style="fill:var(--eyecore)"/>
          <circle cx="86" cy="68" r="5.5" style="fill:var(--eyecore)"/>
          <path d="M54 106 L58 116 L62 106 L66 116 L70 106 L74 116 L78 106 L82 116 L86 106" fill="none" style="stroke:var(--hood)" stroke-width="2" stroke-linejoin="round" opacity=".85"/>
        </svg>
      </div>
      <div class="spine__categories">
        <a class="spine__category-link" href="campanhas.html">Campanhas</a>
        <a class="spine__category-link" href="tomos.html">Tomos de Kauntar</a>
      </div>
      <div id="spineIndex"></div>
    </nav>
  </div>

  <main class="page-wrap">
    <article class="page torn paper-grain" id="page">
      <p class="empty-state">Carregando…</p>
    </article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
