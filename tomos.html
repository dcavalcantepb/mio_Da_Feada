<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomos de Kauntar — O Mio da Feada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body data-scope="tomos">

<header class="masthead">
  <a class="masthead__brand" href="index.html">
    <img class="masthead__mascot" src="img/mascot.png" alt="">
    <span class="masthead__wordmark">
      <span class="masthead__word" id="siteWord">O Mio da Feada</span>
      <span class="masthead__sub" id="siteSub">Bem-vindo a Netéria</span>
    </span>
  </a>
  <div class="masthead__controls">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar entre dia e noite" title="Alternar entre dia e noite"></button>
    <a class="btn btn--ghost masthead__login" href="editor.html">Entrar</a>
  </div>
</header>

<button class="spine-toggle" id="spineToggle" aria-expanded="false" aria-controls="spine">☰ Índice de Tomos</button>

<div class="chronicle">
  <div class="spine-col">
    <a class="btn btn--primary spine__new" id="btnNewEntry" href="editor.html" hidden>+ Nova entrada</a>
    <nav class="spine" id="spine" aria-label="Índice de Tomos">
      <div class="spine__categories">
        <a class="spine__category-link" href="campanhas.html">Campanhas</a>
        <a class="spine__category-link" href="tomos.html">Tomos de Kauntar</a>
      </div>
      <div id="spineIndex"></div>
    </nav>
  </div>

  <main class="page-wrap">
    <article class="page torn paper-grain" id="page">
      <p class="empty-state">Carregando…</p>
    </article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/render.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
